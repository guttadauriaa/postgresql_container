services:
    server:
        build:
          context: .
          dockerfile: Dockerfile-18
        image: 'postgres:18-alpine-ssl'
        restart: always
        ports:
            - 5432:5432
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
            POSTGRES_DB: ${POSTGRES_DB}
            # Force UTF-8 universal (ICU)
            POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=fr-BE"
            POSTGRES_HOST_AUTH_METHOD: scram-sha-256
            PGDATA: /var/lib/postgresql/data/pg_data
            TZ: Europe/Brussels
            USER_NAME: ${USER_NAME}
            USER_PASS: /run/secrets/user_password
            USER_DB: ${USER_DB}
        env_file:
            - .env
        secrets:
            - postgres_password
            - user_password
        volumes:
            - data:/var/lib/postgresql/data:z
            - ./init:/docker-entrypoint-initdb.d:z

    adminer:
        image: 'library/adminer'
        restart: always
        ports:
            - 8080:8080

#    omnidb:
#        image: 'taivokasper/omnidb'
#        ports:
#            - 8082:8080
#            - 25482:25482
#        volumes:
#            - ./omnidb/config.py:/opt/OmniDB-3.0.3b/OmniDB/config.py

    pgadmin:
        image: 'dpage/pgadmin4'
        ports:
            - 5050:5050
        environment:
            - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
            - PGADMIN_DEFAULT_PASSWORD_FILE=/run/secrets/pgadmin_password
            - PGADMIN_REPLACE_SERVERS_ON_STARTUP=${PGADMIN_REPLACE_SERVERS_ON_STARTUP}
            - PGADMIN_SERVER_JSON_FILE=/pgadmin4/servers.json
            - PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION=True
            - PGADMIN_LISTEN_PORT=5050
        volumes:
            - ./pgadmin_servers.json:/pgadmin4/servers.json:ro,z
        env_file:
          - .env
        secrets:
            - pgadmin_password
            - pgpass

volumes:
    data:

secrets:
  postgres_password:
    x-podman.relabel: z
    file: ./secrets/postgres_password.txt
  pgadmin_password:
    x-podman.relabel: z
    file: ./secrets/pgadmin_password.txt
  user_password:
    x-podman.relabel: z
    file: ./secrets/user_password.txt

  pgpass:
    x-podman.relabel: z
    file: ./secrets/pgpass.txt
